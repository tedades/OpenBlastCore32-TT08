# Tiny Tapeout project information
project:
  title:        "OpenBlastCore32-TT08"
  author:       "Tedades"
  discord:      "Tedades"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "OpenBlastCore is an open-sourced 32bit TTA chip designed for retro-gaming on the Tiny TapeOut demo board."
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     50000000 # 20 ns target clock period

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "4x2"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tta_cpu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_tta_cpu.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "PS/2 PMOD Keyboard CLK (receive only)"
  ui[1]: "PS/2 PMOD Keyboard DATA (receive only)"
  ui[2]: "GPIO_IN0"
  ui[3]: "GPIO_IN1"
  ui[4]: "Gamepad PMOD report LATCH"
  ui[5]: "Gamepad PMOD report CLOCK"
  ui[6]: "Gamepad PMOD report DATA"
  ui[7]: "TURBO_MODE"

  # Outputs: Tiny VGA RGB222 mapping
  uo[0]: "VGA R1"
  uo[1]: "VGA G1"
  uo[2]: "VGA B1"
  uo[3]: "VGA VSYNC_n"
  uo[4]: "VGA R0"
  uo[5]: "VGA G0"
  uo[6]: "VGA B0"
  uo[7]: "VGA HSYNC_n"

  # Shared Flash/PSRAM cartridge and mono audio
  uio[0]: "Flash CS_n"
  uio[1]: "QSPI DQ0"
  uio[2]: "QSPI DQ1"
  uio[3]: "QSPI SCK"
  uio[4]: "QSPI DQ2"
  uio[5]: "QSPI DQ3"
  uio[6]: "PSRAM CS_n"
  uio[7]: "Mono audio PWM"

# Do not change!
yaml_version: 6
